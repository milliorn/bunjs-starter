# Dependabot configuration file
# Docs: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    # All updates, majors included, in one grouped PR.
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # npm majors are bumped by hand.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
