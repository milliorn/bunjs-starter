# Dependabot configuration file
# Docs: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    # One PR per ecosystem per run; replaces the rebase cascade, which never
    # fired because GITHUB_TOKEN merges don't trigger workflows.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
