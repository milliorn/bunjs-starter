documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "LICENSE"

source:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "readFile.ts"
          - "writeFile.ts"
          - "writeFile.txt"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "__tests__/**"

server:
  - changed-files:
      - any-glob-to-any-file:
          - "server.ts"

configuration:
  - changed-files:
      - any-glob-to-any-file:
          - "tsconfig*.json"
          - "bunfig.toml"
          - ".gitignore"
          - ".vscode/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "bun.lock"
          - ".github/dependabot.yml"

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/labeler.yml"
