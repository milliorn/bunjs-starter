name: Dependabot reviewer

# Fires whenever Dependabot opens, updates, or reopens a PR targeting main.
# pull_request_target runs in the context of the base branch, which gives the
# GITHUB_TOKEN enough permission to merge without extra secrets.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: ["main"]

# One run per PR at a time. We let the current run finish so an in-progress
# squash merge isn't interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Minimum permissions needed:
# - pull-requests: comment on and close PRs, enable auto-merge
# - contents: perform the squash merge
permissions:
  pull-requests: write
  contents: write

env:
  # Opt into Node.js 24 now ahead of the June 2, 2026 forced migration.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review-dependabot-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip entirely if this PR wasn't opened by Dependabot.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # Decide once: allow github_actions (any semver, majors on purpose) or
      # bun/npm/yarn patch/minor; deny everything else. bun majors are also ignored
      # upstream in dependabot.yml, so deny is a safety net.
      - name: Decide
        id: decision
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          action=deny
          case "$ECOSYSTEM" in
            github_actions) action=allow ;;
            bun|npm_and_yarn)
              case "$UPDATE_TYPE" in
                version-update:semver-patch|version-update:semver-minor) action=allow ;;
              esac ;;
          esac
          echo "action=$action" >> "$GITHUB_OUTPUT"

      # --auto queues the merge so all required branch protection checks must
      # pass first (e.g. dependency-review) before the merge goes through.
      # Note: GITHUB_TOKEN cannot approve PRs (GitHub security policy), so we
      # skip approval and rely on branch protection checks via --auto.
      - name: Allow — merge
        if: steps.decision.outputs.action == 'allow'
        run: |
          gh pr merge "$PR_URL" --squash --auto

      - name: Deny — unexpected update
        if: steps.decision.outputs.action == 'deny'
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          gh pr close "$PR_URL" --comment "Auto-closed: ecosystem \`$ECOSYSTEM\` / update-type \`$UPDATE_TYPE\` did not match any allow-list rule. Check dependabot.yml if this is unexpected."
