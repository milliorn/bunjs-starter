name: "Dependency review"

# Run on every pull request targeting main.
# Scans dependency manifest changes against GitHub's advisory database for known CVEs.
# merge-gatekeeper waits for this check, so a vulnerable dependency blocks automerge
# and manual merges, including Dependabot patch/minor PRs. There is no paths filter:
# the action exits cleanly when no manifests changed.
on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fail if this PR introduces a known vulnerability at low severity or higher.
      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
