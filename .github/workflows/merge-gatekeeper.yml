---
name: Merge Gatekeeper

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: read
  statuses: read

jobs:
  merge-gatekeeper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@bcae4dd95601d7f4dec78eac18d17f372efbd7dd # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
